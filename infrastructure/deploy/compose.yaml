# Zappaloo – one environment (staging or prod), sw-architecture.md 23.4–23.5.
# Staging and prod use this same file; only .env differs. Start through deploy.sh,
# which also sets IMAGE_TAG, APP_VERSION_SUFFIX and the session secret.
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}

services:
  app:
    image: ghcr.io/gravity981/zappaloo:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    # Images are built for linux/amd64 only; the server uses it (23.4).
    platform: linux/amd64
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env}
      # Only a pre-release suffix (rc.N) can be added; the version itself is in the image (23.6).
      APP_VERSION_SUFFIX: ${APP_VERSION_SUFFIX:-}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # Address of the site, for the one-time links the CLI prints (7.1.1).
      PUBLIC_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}:${HTTPS_PORT:-443}
      # Where the source of the running version is offered: the footer link "Quellcode" (LIC-03).
      SOURCE_URL: ${SOURCE_URL:-}
      # Caddy is the only way in: the client address comes from X-Forwarded-For.
      TRUST_PROXY: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Empty file without secrets/smtp_password: a mail server without login (7.1.1).
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - session_secret
      - smtp_password
    volumes:
      - data:/data
      # No bind mounts: deploy.sh streams database backups in and out (sw-architecture.md 23.5).
    # No published port: only Caddy is reachable from outside (OPS-03).
    expose:
      - "3000"

  caddy:
    image: caddy:2.11.7-alpine
    platform: linux/amd64
    restart: unless-stopped
    labels:
      # Compose does not recreate a container when an inline config changes; deploy.sh
      # sets this fingerprint of the Caddy configuration, and a new value recreates Caddy.
      zappaloo.caddy-config: ${CADDY_CONFIG_HASH:-}
    depends_on:
      - app
    # Caddy listens on the same ports inside the container (http_port/https_port
    # below), so its HTTP→HTTPS redirect keeps a non-standard port (staging: 8443).
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Certificates, and on staging Caddy's local CA: kept across deployments, so
      # test devices keep trusting the same root certificate.
      - caddy-data:/data
      - caddy-config:/config

  # Staging only (COMPOSE_PROFILES=mailpit): catches all outgoing mail (OPS-13).
  mailpit:
    image: axllent/mailpit:v1.33.0
    platform: linux/amd64
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

configs:
  caddyfile:
    # TLS_MODE is "internal" (Caddy's local CA, staging) or the contact email for
    # Let's Encrypt (prod). The app sets X-Robots-Tag itself (SEC-10).
    # default_sni: browsers send no server name (SNI) when opening an IP address
    # (staging); without it Caddy finds no certificate and aborts the handshake.
    # The two catch-all sites answer every other host name with 421 and a clear
    # message, instead of Caddy's default empty page (e.g. a wrong SITE_ADDRESS).
    # No on-demand TLS: a foreign server name simply fails the handshake.
    content: |
      {
        default_sni ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
        http_port ${HTTP_PORT:-80}
        https_port ${HTTPS_PORT:-443}
        # Caddy's own redirect drops a non-standard port; see the http:// site below.
        auto_https disable_redirects
      }
      ${SITE_ADDRESS:?set SITE_ADDRESS in .env} {
        tls ${TLS_MODE:?set TLS_MODE in .env}
        encode zstd gzip
        reverse_proxy app:3000 {
          # Server-Sent Events: pass every event on immediately.
          flush_interval -1
        }
      }
      http://${SITE_ADDRESS} {
        redir https://{host}:${HTTPS_PORT:-443}{uri} 308
      }
      https:// {
        tls internal
        respond "421 Misdirected Request: this server only answers to ${SITE_ADDRESS}" 421
      }
      http:// {
        respond "421 Misdirected Request: this server only answers to ${SITE_ADDRESS}" 421
      }

secrets:
  session_secret:
    # deploy.sh reads secrets/session_secret (mode 600) into this variable.
    environment: SESSION_SECRET
  smtp_password:
    # deploy.sh reads secrets/smtp_password (mode 600) into this variable, or leaves it empty.
    environment: SMTP_PASSWORD_SECRET

volumes:
  data:
    name: ${DATA_VOLUME:?set DATA_VOLUME in .env}
  caddy-data:
  caddy-config:
