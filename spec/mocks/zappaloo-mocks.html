<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zappaloo UX Mocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: screen index (left) · device stage (centre) · notes with requirement IDs and open questions (right). Mock interiors use a fixed neutral wireframe palette; the chrome follows the viewer's theme. */
:root {
  --bg: #eceef2;
  --panel: #ffffff;
  --ink: #1a1d24;
  --muted: #5b6270;
  --line: #d4d8df;
  --accent: #2b5bd0;
  --accent-soft: #e3eafb;
  --note-bg: #fff4cf;
  --note-ink: #5a4200;
  --done-bg: #e2f2e6;
  --done-ink: #1f5132;
  --frame: #20232b;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #1a1d24; --ink: #e6e8ed; --muted: #9aa1ad; --line: #2c313b;
    --accent: #86a6ff; --accent-soft: #1f2a44; --note-bg: #352d14; --note-ink: #f1d98e; --done-bg: #183324; --done-ink: #a8e0bc; --frame: #000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --panel: #1a1d24; --ink: #e6e8ed; --muted: #9aa1ad; --line: #2c313b;
  --accent: #86a6ff; --accent-soft: #1f2a44; --note-bg: #352d14; --note-ink: #f1d98e; --done-bg: #183324; --done-ink: #a8e0bc; --frame: #000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-text); }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr) 340px;
  min-height: 100vh;
}
.index {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  border-right: 1px solid var(--line); background: var(--panel);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font: 700 18px/1.1 var(--f-display); letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12px; }
.ix-top { display: flex; flex-direction: column; gap: 2px; }
.ix-group { display: flex; flex-direction: column; gap: 1px; }
.ix-group h3 {
  margin: 0 0 4px; font: 600 10.5px/1.3 var(--f-text); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
}
.ix-link {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 5px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 13px;
}
.ix-link small { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.ix-link:hover { background: var(--bg); }
.ix-link.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ix-link .qn { background: var(--note-bg); color: var(--note-ink); border-radius: 999px; padding: 0 6px; font-weight: 600; }

.stage { min-width: 0; display: flex; flex-direction: column; padding-block: 16px 40px; padding-inline: 24px; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.toolbar h1 { font: 600 20px/1.2 var(--f-display); margin: 0; margin-right: auto; text-wrap: balance; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--panel); }
.seg button[disabled] { opacity: 0.4; cursor: default; }
.variants { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.variants button { border: 1px dashed var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; }
.variants button.on { border-style: solid; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pager { display: flex; gap: 6px; }
.pager a { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 8px; text-decoration: none; font-size: 12.5px; }
.viewport { width: 100%; display: flex; justify-content: center; }
.dev-wrap { position: relative; }
.dev {
  position: absolute; top: 0; left: 0; transform-origin: top left;
  background: var(--frame); border-radius: 34px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
}
.dev.desktop { border-radius: 14px; padding: 0; overflow: hidden; }
.dev.tv { border-radius: 10px; padding: 14px; }
.dev-url {
  height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: #e4e4df; color: #55554f; font: 12px/1 var(--f-text); border-radius: 22px 22px 0 0;
}
.dev.desktop .dev-url { border-radius: 0; background: #dcdcd6; }
.dev-url i { width: 9px; height: 9px; border-radius: 50%; background: #b9b9b2; display: inline-block; }
.dev-url span { background: #f6f6f2; padding: 5px 12px; border-radius: 999px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dev.phone .screen { border-radius: 0 0 22px 22px; }

.notes {
  border-left: 1px solid var(--line); background: var(--panel);
  padding-block: 20px 40px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow: auto;
}
.notes h2 { font: 600 16px/1.3 var(--f-display); margin: 0; }
.path { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
.reqs { display: flex; flex-wrap: wrap; gap: 4px; }
.req { font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-radius: 5px; padding: 4px 5px; color: var(--muted); }
.nsec { display: flex; flex-direction: column; gap: 6px; }
.nsec h4 { margin: 0; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.nsec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.q { background: var(--note-bg); color: var(--note-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.q b { font-family: var(--f-display); }
.q em { font-style: normal; opacity: 0.85; font-size: 12.5px; }
.q.done { background: var(--done-bg); color: var(--done-ink); }
.q .dec { font-size: 12.5px; }
.q .new { align-self: flex-start; font: 600 10px/1.6 var(--f-text); letter-spacing: .06em; text-transform: uppercase; background: var(--note-ink); color: var(--note-bg); border-radius: 4px; padding: 0 5px; }
.mobile-pick { display: none; }

.doc { max-width: 920px; display: flex; flex-direction: column; gap: 22px; }
.doc p { margin: 0; max-width: 68ch; color: var(--muted); }
.doc h2 { font: 600 17px/1.3 var(--f-display); margin: 0; }
.flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.flow { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.flow h3 { margin: 0; font: 600 15px/1.3 var(--f-display); }
.flow p { font-size: 12.5px; }
.chain { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; }
.chain a { background: var(--bg); border-radius: 6px; padding: 3px 8px; text-decoration: none; color: var(--ink); }
.chain a:hover { color: var(--accent); }
.chain span { color: var(--muted); }
.qlist { display: flex; flex-direction: column; gap: 10px; }
.qgroup { display: flex; flex-direction: column; gap: 8px; }
.qgroup h3 { margin: 0; font: 600 14px/1.3 var(--f-display); }
.qgroup h3 a { text-decoration: none; }

@media (max-width: 1240px) {
  .app { grid-template-columns: 232px minmax(0, 1fr); }
  .notes { grid-column: 2; position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); padding-left: 24px; }
}
@media (max-width: 780px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .index { display: none; }
  .notes { grid-column: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .stage { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mobile-pick { display: flex; gap: 8px; align-items: center; }
  .mobile-pick select { flex: 1; min-width: 0; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
}

/* ---------- Mock interior: fixed wireframe palette ---------- */
.screen {
  --w-bg: #f4f4f1; --w-card: #ffffff; --w-ink: #1f1f1d; --w-muted: #6a6a64; --w-line: #d5d5ce;
  --w-fill: #e8e8e2; --w-dark: #2a2a28; --w-badge: #c4422e; --w-ok: #2d7a4c; --w-warn: #a06a00;
  color-scheme: light;
  background: var(--w-bg); color: var(--w-ink); font: 14px/1.45 var(--f-text);
  container-type: inline-size; overflow: auto; position: relative; flex: 1;
}
.screen * { box-sizing: border-box; }
.screen a { color: var(--w-ink); text-decoration: underline; cursor: pointer; }
.screen p { margin: 0; }
.screen svg.i { width: 18px; height: 18px; flex: none; }
.m-h1 { font: 600 23px/1.2 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.m-h2 { font: 600 16px/1.3 var(--f-display); margin: 0; }
.m-muted { color: var(--w-muted); }
.sm { font-size: 12.5px; }
.m-eyebrow { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--w-muted); font-weight: 600; }
.m-stack { display: flex; flex-direction: column; gap: 12px; }
.m-grid-d2, .m-grid-d3 { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.m-row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.m-hr { border: 0; border-top: 1px solid var(--w-line); margin: 4px 0; width: 100%; }
.m-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 18px;
  border-radius: 10px; background: var(--w-dark); color: #fff; border: 1.5px solid var(--w-dark); font-weight: 600; font-size: 14px; cursor: pointer;
}
.m-btn.ghost { background: transparent; color: var(--w-ink); border-color: var(--w-ink); }
.m-btn.soft { background: var(--w-fill); color: var(--w-ink); border-color: var(--w-fill); }
.m-btn.danger { background: transparent; color: var(--w-badge); border-color: currentColor; }
.m-btn.sm { min-height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
.m-btn.block { width: 100%; }
.m-btn[disabled] { opacity: 0.32; cursor: not-allowed; }
.m-field { display: flex; flex-direction: column; gap: 5px; }
.m-field > span { font-size: 12.5px; font-weight: 600; }
.m-input {
  width: 100%; min-height: 44px; border: 1.5px solid var(--w-line); border-radius: 10px; padding: 0 12px;
  background: #fff; font: inherit; color: inherit;
}
textarea.m-input { min-height: 84px; padding: 10px 12px; resize: vertical; }
select.m-input { appearance: auto; }
.m-code { font: 600 22px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; }
.m-hint { font-size: 12px; color: var(--w-muted); }
.m-card { background: var(--w-card); border: 1px solid var(--w-line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.m-card.flat { background: var(--w-fill); border-color: var(--w-fill); }
.m-card.strong { border: 2px solid var(--w-ink); }
.m-seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--w-fill); border-radius: 10px; padding: 3px; }
.m-seg button { border: 0; background: none; min-height: 36px; padding: 0 16px; border-radius: 8px; font-weight: 600; color: var(--w-muted); cursor: pointer; }
.m-seg button.on { background: #fff; color: var(--w-ink); box-shadow: 0 1px 2px rgba(0,0,0,0.14); }
.m-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.m-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--w-line); background: #fff; font-size: 13px; cursor: pointer; color: var(--w-ink);
}
.m-chip.on { border-color: var(--w-ink); background: var(--w-ink); color: #fff; }
.m-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--w-fill); color: var(--w-ink); white-space: nowrap; }
.m-tag.ok { background: #dcefe2; color: var(--w-ok); }
.m-tag.warn { background: #f6e8c8; color: var(--w-warn); }
.m-tag.bad { background: #f6dcd6; color: var(--w-badge); }
.m-tag.line { background: transparent; border: 1px solid var(--w-line); color: var(--w-muted); }
.m-list { display: flex; flex-direction: column; }
.m-li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--w-line); min-width: 0; }
.m-li:last-child { border-bottom: 0; }
.m-li > .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.m-li.link { cursor: pointer; }
.m-av { width: 40px; height: 40px; border-radius: 50%; background: var(--w-fill); border: 1.5px solid var(--w-line); display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--w-muted); flex: none; }
.m-av.lg { width: 72px; height: 72px; font-size: 20px; }
.m-ph {
  position: relative; width: 100%; max-width: 100%; border-radius: 10px; background-color: var(--w-fill);
  background-image:
    linear-gradient(to top right, transparent calc(50% - 0.6px), var(--w-line) 50%, transparent calc(50% + 0.6px)),
    linear-gradient(to top left, transparent calc(50% - 0.6px), var(--w-line) 50%, transparent calc(50% + 0.6px));
  display: grid; place-items: center; overflow: hidden;
}
.m-ph span { background: var(--w-fill); padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--w-muted); text-align: center; }
.m-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.m-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.m-switch { width: 44px; height: 26px; border-radius: 999px; background: var(--w-line); border: 0; position: relative; cursor: pointer; flex: none; }
.m-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.m-switch.on { background: var(--w-ok); }
.m-switch.on::after { left: 21px; }
.m-lock { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--w-muted); }
.m-scroll { overflow-x: auto; }
.m-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.m-table th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--w-muted); font-weight: 600; padding: 8px 10px; border-bottom: 1.5px solid var(--w-line); white-space: nowrap; }
.m-table td { padding: 10px; border-bottom: 1px solid var(--w-line); vertical-align: middle; }
.m-table tr.me td { background: #fbf3d9; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* site shell */
.m-site { display: flex; flex-direction: column; min-height: 100%; }
.m-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--w-card); border-bottom: 1px solid var(--w-line); position: sticky; top: 0; z-index: 5; }
.m-brand { display: flex; flex-direction: column; line-height: 1.15; cursor: pointer; }
.m-brand b { font: 600 16px/1.15 var(--f-display); }
.m-brand small { color: var(--w-muted); font-size: 11px; }
.m-head-r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.m-topnav { display: none; }
.m-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1000px; margin-inline: auto; }
.m-tabbar { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--w-card); border-top: 1px solid var(--w-line); padding: 4px 4px 12px; z-index: 5; }
.m-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--w-muted); background: none; border: 0; padding: 6px 0 2px; cursor: pointer; }
.m-tab svg.i { width: 22px; height: 22px; }
.m-tab.on { color: var(--w-ink); font-weight: 700; }
.m-crumb { font-size: 12px; color: var(--w-muted); display: flex; gap: 6px; align-items: center; }
.m-subtabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--w-line); }
.m-subtabs button { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--w-muted); border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; cursor: pointer; }
.m-subtabs button.on { color: var(--w-ink); border-bottom-color: var(--w-ink); }

/* bare + flow shells */
.m-bare { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 40px; gap: 22px; }
.m-bare-brand { font: 600 15px/1 var(--f-display); color: var(--w-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.m-bare-brand small { font: 11px/1 var(--f-text); }
.m-bare-inner { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
.m-flow { min-height: 100%; display: flex; flex-direction: column; }
.m-flowhead { position: sticky; top: 0; z-index: 5; background: var(--w-card); border-bottom: 1px solid var(--w-line); padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px; }
.m-flowhead .top { display: flex; align-items: center; gap: 10px; }
.m-flowhead .top b { flex: 1; text-align: center; font: 600 14px/1.2 var(--f-display); }
.m-iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--w-fill); display: grid; place-items: center; cursor: pointer; color: var(--w-ink); flex: none; }
.m-progress { display: grid; grid-auto-flow: column; gap: 4px; padding-bottom: 10px; }
.m-progress i { height: 4px; border-radius: 2px; background: var(--w-line); }
.m-progress i.on { background: var(--w-ink); }
.m-flowbody { flex: 1; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 620px; margin-inline: auto; }
.m-flowfoot { position: sticky; bottom: 0; background: var(--w-card); border-top: 1px solid var(--w-line); padding: 12px 16px 16px; display: flex; gap: 8px; }
.m-flowfoot > * { flex: 1; }
.m-flowfoot-in { max-width: 620px; margin-inline: auto; width: 100%; display: flex; gap: 8px; }
.m-flowfoot-in > * { flex: 1; }

/* program items */
.m-program-item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.m-program-item .grow { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.m-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.m-sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--w-line); cursor: pointer; }
.m-sw.on { box-shadow: 0 0 0 2.5px var(--w-ink); }
.m-templates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.m-templates canvas { background: var(--w-fill); border-radius: 10px; border: 1.5px solid var(--w-line); cursor: pointer; flex: none; image-rendering: pixelated; }
.m-avatar-stage { background: repeating-conic-gradient(#e3e3dc 0 25%, #ecece6 0 50%) 0 0 / 24px 24px; border-radius: 14px; display: grid; place-items: center; padding: 18px; border: 1px solid var(--w-line); }
.m-avatar-stage canvas { image-rendering: pixelated; }
.m-person-tabs { display: flex; gap: 8px; }
.m-pixel { font-family: var(--f-pixel); }

.m-nownext { display: grid; gap: 0; border: 2px solid var(--w-ink); border-radius: 14px; overflow: hidden; background: var(--w-card); }
.m-nownext > div { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.m-nownext > div + div { border-top: 1px solid var(--w-line); background: var(--w-bg); }
.m-nownext .when { font: 700 11px/1.2 var(--f-text); letter-spacing: 0.08em; text-transform: uppercase; width: 62px; flex: none; }
.m-nownext .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.m-timeline { display: flex; flex-direction: column; }
.m-tl { display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); gap: 0 10px; }
.m-tl .t { font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 12px; font-size: 13px; }
.m-tl .rail { position: relative; }
.m-tl .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--w-line); }
.m-tl .rail::after { content: ""; position: absolute; left: 3px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--w-card); border: 2px solid var(--w-ink); }
.m-tl.now .rail::after { background: var(--w-badge); border-color: var(--w-badge); }
.m-tl.past { color: var(--w-muted); }
.m-tl .c { padding: 10px 0 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.m-masonry { columns: 2 160px; column-gap: 10px; }
.m-masonry > * { break-inside: avoid; margin-bottom: 10px; }
.m-quote { font-size: 14px; line-height: 1.55; }
.m-sig { font-size: 12px; color: var(--w-muted); }
.m-galgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.m-galgrid .m-ph { border-radius: 4px; }
.m-empty { text-align: center; padding: 36px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.m-bars { display: flex; flex-direction: column; gap: 8px; }
.m-bar-row { display: grid; grid-template-columns: 80px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; }
.m-bar-row .track { height: 10px; background: var(--w-fill); border-radius: 5px; overflow: hidden; display: flex; }
.m-bar-row .track i { display: block; height: 100%; }
.m-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.m-kpi { background: var(--w-card); border: 1px solid var(--w-line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.m-kpi b { font: 600 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.m-kpi.alert { border: 2px solid var(--w-ink); }
.m-seattable { width: 168px; height: 168px; position: relative; margin: 6px auto; }
.m-seattable .tbl { position: absolute; inset: 36px; border-radius: 50%; background: var(--w-fill); border: 2px solid var(--w-line); display: grid; place-items: center; font: 600 12px/1.2 var(--f-display); text-align: center; color: var(--w-muted); }
.m-seattable .seat { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff; border: 1.5px solid var(--w-line); display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--w-muted); }
.m-seattable .seat.me { background: var(--w-ink); color: #fff; border-color: var(--w-ink); }
.m-seattable .seat.mate { border-color: var(--w-ink); color: var(--w-ink); }
.m-composer-photo { border: 2px dashed var(--w-line); border-radius: 14px; min-height: 168px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: #fff; text-align: center; padding: 16px; }
.m-composer-photo.has { border-style: solid; padding: 0; overflow: hidden; position: relative; }
.m-composer-photo.has .m-ph { border-radius: 0; height: 200px; }
.m-composer-photo .rm { position: absolute; top: 8px; right: 8px; }
.m-check { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--w-ok); color: var(--w-ok); display: grid; place-items: center; }
.m-check svg.i { width: 36px; height: 36px; }
.m-mdsplit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.m-mdsplit textarea { min-height: 260px; font: 12.5px/1.6 ui-monospace, Menlo, monospace; }
.m-md h1 { font: 600 20px/1.2 var(--f-display); margin: 0 0 6px; }
.m-md h2 { font: 600 15px/1.3 var(--f-display); margin: 12px 0 4px; }
.m-md p, .m-md ul { margin: 0 0 8px; }
.m-md ul { padding-left: 20px; }
.m-qr { width: 64px; height: 64px; background: #fff; border-radius: 6px; padding: 5px; flex: none; }
.m-qr canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.m-cards-print { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.m-printcard { border: 1.5px dashed var(--w-muted); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #fff; text-align: center; }
.m-printcard .m-qr { width: 96px; height: 96px; padding: 0; }

/* admin shell */
.m-admin { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; min-height: 100%; }
.m-ahead { background: var(--w-dark); color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 14px; position: sticky; top: 0; z-index: 6; }
.m-ahead b { font: 600 15px/1.2 var(--f-display); }
.m-ahead .m-tag { background: rgba(255,255,255,0.14); color: #fff; }
.m-ahead a { color: #fff; margin-left: auto; font-size: 12.5px; }
.m-anav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; background: var(--w-card); border-bottom: 1px solid var(--w-line); }
.m-anav button { white-space: nowrap; border: 0; background: none; padding: 7px 10px; border-radius: 8px; color: var(--w-muted); cursor: pointer; font-weight: 500; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.m-anav button.on { background: var(--w-fill); color: var(--w-ink); font-weight: 700; }
.m-anav .cnt { background: var(--w-badge); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 0 6px; font-weight: 700; }
.m-amain { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.m-sethead { display: flex; align-items: center; gap: 12px; }
.m-sethead .grow { flex: 1; min-width: 0; }
.m-setrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--w-line); }
.m-setrow:last-child { border-bottom: 0; }
.m-setrow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* game */
.m-game { position: relative; height: 100%; overflow: hidden; background: #9cbf73; user-select: none; }
.m-game canvas.m-map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
.m-gbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; z-index: 3; margin-inline: auto; max-width: 620px; }
.m-gbtn { flex: 1; min-width: 0; background: rgba(255,255,255,0.95); border: 2px solid #222; border-radius: 11px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 700; position: relative; cursor: pointer; color: #222; box-shadow: 2px 2px 0 rgba(0,0,0,0.25); padding: 4px 2px; }
.m-gbtn small { font-weight: 500; font-size: 9.5px; color: var(--w-badge); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.m-gbtn .dot { position: absolute; top: -7px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--w-badge); color: #fff; font-size: 11px; display: grid; place-items: center; border: 2px solid #fff; }
.m-gme { position: absolute; left: 10px; bottom: 12px; z-index: 3; display: flex; gap: 6px; }
.m-gme button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #222; background: rgba(255,255,255,0.95); display: grid; place-items: center; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,0.25); color: #222; }
.m-bubble { position: absolute; z-index: 4; width: 214px; background: #fff; border: 2px solid #222; border-radius: 12px; padding: 10px; transform: translate(-50%, calc(-100% - 12px)); box-shadow: 3px 3px 0 rgba(0,0,0,0.25); display: flex; gap: 10px; cursor: pointer; }
.m-bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: #fff; border-right: 2px solid #222; border-bottom: 2px solid #222; transform: translateX(-50%) rotate(45deg); }
.m-bubble .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.m-bubble b { font-size: 13px; }
.m-bubble .x { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; border-radius: 50%; background: #222; color: #fff; border: 0; display: grid; place-items: center; cursor: pointer; font-size: 13px; }
.m-otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.m-otp input { min-width: 0; height: 56px; text-align: center; font: 600 24px/1 ui-monospace, Menlo, monospace; text-transform: uppercase; padding: 0; }
.m-gnow { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.95); border: 2px solid #222; border-radius: 999px; padding: 5px 14px 5px 5px; box-shadow: 2px 2px 0 rgba(0,0,0,0.25); font-size: 12.5px; color: #222; cursor: pointer; white-space: nowrap; max-width: calc(100% - 20px); }
.m-gnow .when { background: var(--w-badge); color: #fff; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; }
.m-gnow small { color: #666; overflow: hidden; text-overflow: ellipsis; }
.m-gprompt { position: absolute; z-index: 4; transform: translate(-50%, -100%); background: #222; color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; display: flex; gap: 6px; align-items: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.25); }
.m-gprompt kbd { background: #fff; color: #222; border-radius: 4px; padding: 0 5px; font: 600 10.5px/1.6 ui-monospace, monospace; }
.m-tvqrpop { position: absolute; right: 30px; bottom: 34px; z-index: 2; transition: opacity .5s, transform .5s; }
.m-tvqrpop.off { opacity: 0; transform: translateY(16px); }
.m-tvqrpop .m-tvqr { width: 210px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.m-tvqrpop .m-qr { width: 130px; height: 130px; }
.m-viewer { position: absolute; inset: 0; background: rgba(10,10,10,0.94); z-index: 5; display: flex; flex-direction: column; color: #fff; }
.m-viewer .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.m-viewer .img { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 14px; min-height: 0; }
.m-viewer .img .m-ph { width: 100%; max-width: 760px; background-color: #2a2a2a; }
.m-viewer .cap { padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 4px; max-width: 760px; width: 100%; margin-inline: auto; }
.m-gfade { position: absolute; inset: 0; z-index: 6; background: #111; color: #fff; display: grid; place-items: center; font: 12px/1.4 Silkscreen, monospace; text-align: center; animation: m-fade 1.2s ease both; }
.m-gfade[hidden] { display: none; }
@keyframes m-fade { 0% { opacity: 0; } 30%, 70% { opacity: 1; } 100% { opacity: 0; } }
.m-gtoast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(20,20,20,0.85); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 12px; z-index: 3; white-space: nowrap; pointer-events: none; }
.m-ovl { position: absolute; inset: 0; z-index: 8; background: rgba(18,18,18,0.5); display: flex; flex-direction: column; justify-content: flex-end; }
.m-paused { position: absolute; top: 14px; left: 14px; color: #fff; font: 12px/1 var(--f-pixel); letter-spacing: 0.05em; }
.m-sheet { background: var(--w-bg); width: 100%; max-height: 90%; border-radius: 18px 18px 0 0; overflow: auto; display: flex; flex-direction: column; }
.m-sheethead { position: sticky; top: 0; z-index: 2; background: var(--w-card); display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--w-line); }
.m-sheethead b { flex: 1; font: 600 16px/1.2 var(--f-display); }
.m-sheetbody { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* waiting page */
.m-wait { position: relative; height: 100%; overflow: hidden; background: #2d2832; color: #fff; }
.m-wait canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.m-wait-top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 2; font-size: 12px; }
.m-wait-top b { font: 600 14px/1.1 var(--f-display); }
.m-wait-top button { background: rgba(255,255,255,0.14); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
.m-wait-card { position: absolute; left: 14px; right: 14px; bottom: 16px; margin-inline: auto; max-width: 460px; background: #fffaf0; color: #2a2420; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); z-index: 2; }
.m-wait-card p { font-size: 15px; line-height: 1.5; }
.m-count { display: flex; gap: 8px; justify-content: center; }
.m-count div { background: #2d2832; color: #ffd27a; border-radius: 8px; padding: 6px 8px; min-width: 52px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.m-count b { font: 18px/1 var(--f-pixel); font-weight: 400; }
.m-count small { font-size: 9.5px; color: #d8cdb8; }

/* install hint (waiting page strip, install screen) */
.m-wait-hint { position: absolute; top: 52px; left: 14px; right: 14px; z-index: 2; max-width: 460px; margin-inline: auto; background: rgba(255,250,240,0.96); color: #2a2420; border-radius: 12px; padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
.m-wait-hint span { flex: 1; line-height: 1.35; }
.m-wait-hint a { font-weight: 700; text-decoration: underline; cursor: pointer; white-space: nowrap; }
.m-wait-hint button { background: transparent; border: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: inherit; }
.m-install-tile { display: flex; align-items: center; gap: 12px; }
.m-install-tile i { width: 56px; height: 56px; border-radius: 14px; background: #2a2a28; color: #f4f4f1; display: grid; place-items: center; font: 400 26px/1 var(--f-pixel); font-style: normal; flex: none; }
.m-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.m-steps li { padding-left: 4px; }
.m-steps svg.i { width: 18px; height: 18px; vertical-align: -4px; margin: 0 2px; }

/* legal notice under "Datenschutz · Version" (step 3.5d) */
.m-legal { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border-top: 1px solid var(--w-line); padding-top: 14px; margin-top: 6px; color: var(--w-muted); width: 100%; }
.m-legal > b { font: 500 12.5px/1.3 var(--f-text); color: var(--w-ink); }
.m-legal > span { font-size: 12px; line-height: 1.4; max-width: 420px; }
.m-legal-links { display: flex; gap: 14px; font-size: 12px; }
.m-legal-links a { color: var(--w-muted); text-decoration: underline; cursor: pointer; }
.m-license { white-space: pre-wrap; font: 11.5px/1.45 ui-monospace, monospace; background: var(--w-fill); border-radius: 10px; padding: 12px; margin: 0 0 8px; max-height: 220px; overflow: auto; }

/* moderation */
.m-mod { height: 100%; display: flex; flex-direction: column; background: #1c1c1e; color: #f2f2f2; }
.m-modhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.m-modhead b { font: 600 15px/1.2 var(--f-display); }
.m-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #cfcfcf; }
.m-live i { width: 8px; height: 8px; border-radius: 50%; background: #3fbf6f; display: inline-block; box-shadow: 0 0 0 3px rgba(63,191,111,0.25); }
.m-modarea { flex: 1; position: relative; display: grid; place-items: center; padding: 8px 16px; min-height: 0; }
.m-modcard { width: 100%; max-width: 380px; background: #fff; color: #1f1f1d; border-radius: 18px; overflow: hidden; touch-action: none; cursor: grab; box-shadow: 0 12px 30px rgba(0,0,0,0.4); transition: transform 0.2s; position: relative; }
.m-modcard.drag { transition: none; }
.m-modcard .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.m-modcard .stamp { position: absolute; top: 18px; padding: 4px 10px; border: 3px solid; border-radius: 8px; font: 700 18px/1 var(--f-display); opacity: 0; text-transform: uppercase; background: rgba(255,255,255,0.85); }
.m-modcard .stamp.yes { left: 16px; color: var(--w-ok); transform: rotate(-12deg); }
.m-modcard .stamp.no { right: 16px; color: var(--w-badge); transform: rotate(12deg); }
.m-modbtns { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 12px 16px 20px; }
.m-modbtns .r { width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; }
.m-modbtns .r svg.i { width: 28px; height: 28px; }
.m-modbtns .no { background: #3a2422; color: #ff8a78; }
.m-modbtns .yes { background: #1f3a2a; color: #6fe3a0; }
.m-modbtns .u { background: #2c2c2e; color: #ddd; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 12.5px; }
.m-modbtns .u[disabled] { opacity: 0.35; }
.m-keys { text-align: center; font-size: 11.5px; color: #9a9a9a; padding-bottom: 12px; display: none; }
.m-modtoast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fff; color: #222; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; z-index: 3; }

/* event screen */
.m-tv { height: 100%; background: #141414; color: #f4f4f4; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.m-tvtop { display: flex; justify-content: space-between; align-items: center; padding: 22px 34px 0; font: 600 20px/1.2 var(--f-display); }
.m-tvtop small { font: 500 15px/1 var(--f-text); color: #aaa; }
.m-tvmain { flex: 1; display: flex; gap: 30px; padding: 20px 34px 30px; min-height: 0; }
.m-tvphoto { flex: 1; position: relative; border-radius: 14px; overflow: hidden; min-width: 0; }
.m-tvphoto .m-ph { height: 100%; border-radius: 0; background-color: #2a2a2a; background-image:
    linear-gradient(to top right, transparent calc(50% - 0.6px), #3a3a3a 50%, transparent calc(50% + 0.6px)),
    linear-gradient(to top left, transparent calc(50% - 0.6px), #3a3a3a 50%, transparent calc(50% + 0.6px)); }
.m-tvphoto .m-ph span { background: #2a2a2a; color: #888; font-size: 15px; }
.m-tvcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 28px 22px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); font: 500 30px/1.25 var(--f-display); display: flex; flex-direction: column; gap: 6px; }
.m-tvcap small { font: 400 17px/1.2 var(--f-text); color: #ccc; }
.m-tvside { width: 250px; display: flex; flex-direction: column; gap: 14px; justify-content: flex-end; }
.m-tvqr { background: #fff; color: #111; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-weight: 600; font-size: 15px; }
.m-tvqr .m-qr { width: 150px; height: 150px; padding: 0; }
.m-tvdots { display: flex; gap: 8px; justify-content: center; padding-bottom: 18px; }
.m-tvdots i { width: 44px; height: 5px; border-radius: 3px; background: #444; display: block; }
.m-tvdots i.on { background: #f4f4f4; }
.m-tvboard { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.m-tvrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 140px; gap: 16px; align-items: center; background: #1f1f1f; border-radius: 12px; padding: 12px 20px; font: 500 24px/1.2 var(--f-display); }
.m-tvrow .rk { font: 26px/1 var(--f-pixel); color: #ffd27a; }
.m-tvrow .sc { text-align: right; font-variant-numeric: tabular-nums; }
.m-tvrow.up { outline: 2px solid #ffd27a; }

@container (min-width: 720px) {
  .m-tabbar { display: none; }
  .m-topnav { display: flex; gap: 2px; margin-left: 22px; }
  .m-topnav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--w-muted); font-weight: 500; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .m-topnav button.on { background: var(--w-fill); color: var(--w-ink); font-weight: 700; }
  .m-head { padding: 12px 28px; }
  .m-body { padding: 28px 32px 40px; }
  .m-h1 { font-size: 28px; }
  .m-grid-d2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .m-grid-d3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .m-galgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .m-masonry { columns: 3 200px; }
  .m-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .m-mdsplit { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .m-admin { grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .m-ahead { grid-column: 1 / -1; }
  .m-anav { flex-direction: column; overflow: visible; border-bottom: 0; border-right: 1px solid var(--w-line); padding: 16px 10px; }
  .m-amain { padding: 24px 28px 40px; }
  .m-ovl { justify-content: center; align-items: center; }
  .m-sheet { width: 620px; border-radius: 18px; max-height: 84%; }

(() => {

/* ---------- icons ---------- */

function seatingBody(compact) {
  const mates = [["Lukas Meier", "Freunde Bräutigam", "Bin für jeden Tanz zu haben!"], ["Sara Keller", "Freunde Braut", "Frag mich nach dem Kuchen."], ["Mia Huber", "Begleitperson von Erika", ""], ["Tom Brunner", "Arbeit", "Neu in Bern – sag hallo!"]];
  const seats = 8, R = 66;
  const seatHtml = Array.from({ length: seats }, (_, i) => {
    const a = (i / seats) * Math.PI * 2 - Math.PI / 2;
    const cls = i === 0 ? "me" : i < 5 ? "mate" : "";
    const lbl = ["EH", "MH", "LM", "SK", "TB", "", "", ""][i];
    return `<div class="seat ${cls}" style="left:${84 + R * Math.cos(a)}px;top:${84 + R * Math.sin(a)}px">${lbl}</div>`;
  }).join("");
  void seatHtml;
  return `<div class="m-card strong" style="align-items:center;text-align:center"><span class="m-eyebrow">Dein Tisch</span><h2 class="m-h1" style="font-size:26px">Edelweiss</h2><span class="m-muted sm">Dinner · Landgasthof Linde, Saal · 8 Plätze</span><button class="m-btn soft sm" data-go="game">${ic("pin")} ${compact ? "Zeig mir den Weg" : "In der Spielwelt zeigen"}</button></div>
    <b>An deinem Tisch</b><div class="m-list">${mates.map(([n, b, g]) => `<div class="m-li"><div class="m-av">${n.split(" ").map((s) => s[0]).join("")}</div><div class="grow"><b>${n}</b>${g ? `<span class="sm">${g}</span>` : ""}</div><span class="m-tag">${b}</span></div>`).join("")}</div>`;
}

/* ---------- pixel art: avatars ---------- */
const SKIN = ["#f6d7bf", "#e8b894", "#c98e64", "#8d5a3b", "#5c3a24"];
const HAIRC = ["#2b2220", "#6b4423", "#c48a3c", "#e7cf8a", "#a33a2a", "#9a9a9a"];
const TOPC = ["#3d5a99", "#b6483c", "#3f7a52", "#d9a640", "#6b4d8a", "#f2f2ee", "#2a2a28"];
const STYLES = ["Kurz", "Lang", "Dutt", "Glatze"];
const CLOTHES = ["Hemd", "Kleid", "Anzug"];
const ACCS = ["Keins", "Hut", "Brille", "Blume"];
const AV = {
  me: { skin: 1, hair: 2, style: 1, clothes: 1, top: 2, acc: 3 },
  mia: { skin: 1, hair: 3, style: 2, clothes: 1, top: 3, acc: 0 },
};
function sprite(ctx, x, y, p, c, frame = 0) {
  const R = (cx, cy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x + cx * p), Math.round(y + cy * p), Math.ceil(w * p), Math.ceil(h * p)); };
  const hair = HAIRC[c.hair], skin = SKIN[c.skin], top = TOPC[c.top];
  const dark = "#2a2420";
  // legs
  const l1 = frame ? 1 : 0;
  if (CLOTHES[c.clothes] === "Kleid") { R(1, 9, 6, 1, top); R(2, 10, 1, 2 - l1, skin); R(5, 10, 1, 1 + l1, skin); }
  else { const pants = CLOTHES[c.clothes] === "Anzug" ? "#2a2a2e" : "#4a4a52"; R(2, 10, 2, 2 - l1, pants); R(4, 10, 2, 1 + l1, pants); }
  // body
  R(1, 6, 6, 4, top); R(0, 6, 1, 3, top); R(7, 6, 1, 3, top); R(0, 9, 1, 1, skin); R(7, 9, 1, 1, skin);
  if (CLOTHES[c.clothes] === "Anzug") { R(3, 6, 2, 3, "#f2f2ee"); R(3.5, 6.5, 1, 2, "#b6483c"); }
  if (CLOTHES[c.clothes] === "Kleid") R(1, 8, 6, 1, top);
  // head
  R(1, 2, 6, 4, skin);
  R(2, 4, 1, 1, dark); R(5, 4, 1, 1, dark);
  const st = STYLES[c.style];
  if (st !== "Glatze") { R(1, 1, 6, 2, hair); R(2, 0, 4, 1, hair); R(1, 3, 1, 1, hair); R(6, 3, 1, 1, hair); }
  else { R(1, 2, 6, 1, skin); R(1, 2, 1, 2, hair); R(6, 2, 1, 2, hair); }
  if (st === "Lang") { R(0, 2, 1, 5, hair); R(7, 2, 1, 5, hair); R(1, 4, 1, 2, hair); R(6, 4, 1, 2, hair); }
  if (st === "Dutt") { R(3, -1, 2, 1, hair); }
  const a = ACCS[c.acc];

        const v = 22 * dt; f.x += (ddx / dd) * v; f.y += (ddy / dd) * v; f.f = Math.floor(t / 220) % 2;

/* ---------- waiting page door scene ---------- */
function mountDoor(root) {
  const host = root.querySelector("[data-door]");

  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const floorY = H * 0.56;
  const dw = Math.min(150, W * 0.36), dh = dw * 1.6;
  const dx = W / 2 - dw / 2, dy = floorY - dh;
  let gap = 18, want = 18, glimpseUntil = 0;
  const workers = [
    { x: 0, sp: 18, cfg: { skin: 1, hair: 1, style: 0, clothes: 0, top: 1, acc: 1 }, carry: "plank" },
    { x: 40, sp: -12, cfg: { skin: 3, hair: 0, style: 1, clothes: 0, top: 2, acc: 0 }, carry: "lantern" },
    { x: 80, sp: 9, cfg: { skin: 0, hair: 2, style: 2, clothes: 1, top: 4, acc: 0 }, carry: "brush" },
  ];
  const motes = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() * 0.7 }));
  cv.addEventListener("pointerdown", (e) => {
    const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
    if (x > dx - 10 && x < dx + dw + 20 && y > dy && y < floorY) glimpseUntil = performance.now() + 3500;
  });
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    want = t < glimpseUntil ? dw * 0.55 : 18;
    gap += (want - gap) * Math.min(1, dt * 4);
    ctx.fillStyle = "#2d2832"; ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < floorY; y += 14) for (let x = (y / 14) % 2 ? -14 : 0; x < W; x += 28) { ctx.fillStyle = (x + y) % 3 ? "#352f3b" : "#3a3340"; ctx.fillRect(x + 1, y + 1, 26, 12); }
    ctx.fillStyle = "#24202a"; ctx.fillRect(0, floorY, W, H - floorY);
    for (let x = 0; x < W; x += 40) { ctx.fillStyle = "#2a2530"; ctx.fillRect(x, floorY + 4, 38, H); }
    // interior
    const gx = dx + dw - gap;
    ctx.save(); ctx.beginPath(); ctx.rect(gx, dy, gap, dh); ctx.clip();
    ctx.fillStyle = "#ffd27a"; ctx.fillRect(gx, dy, gap, dh);
    ctx.fillStyle = "#f6b95c"; ctx.fillRect(gx, floorY - 22, gap, 22);
    ctx.fillStyle = "#e9a24a"; for (let i = 0; i < 6; i++) ctx.fillRect(dx + i * 30 + ((t / 50) % 30), dy + 16, 4, 4);
    for (const w of workers) {
      if (!reduce) { w.x += w.sp * dt; if (w.x > dw + 20) w.x = -40; if (w.x < -40) w.x = dw + 20; }
      const px = dx + w.x, py = floorY - 40;
      sprite(ctx, px, py, 3, w.cfg, Math.floor(t / 200) % 2);
      ctx.fillStyle = "#8a5a32";
      if (w.carry === "plank") ctx.fillRect(px - 16, py + 16, 56, 5);
      if (w.carry === "lantern") { ctx.fillStyle = "#ff8c3a"; ctx.fillRect(px + 24, py + 12, 8, 10); ctx.fillStyle = "#fff2b0"; ctx.fillRect(px + 26, py + 14, 4, 6); }
      if (w.carry === "brush") { ctx.fillRect(px + 24, py + 4, 3, 18); ctx.fillStyle = "#b6483c"; ctx.fillRect(px + 23, py, 5, 6); }
    }
    ctx.restore();
    // light wedge
    const lg = ctx.createLinearGradient(0, floorY, 0, H);
    lg.addColorStop(0, "rgba(255,210,122,0.45)"); lg.addColorStop(1, "rgba(255,210,122,0)");
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(gx, floorY); ctx.lineTo(gx + gap, floorY); ctx.lineTo(gx + gap * 2.6 + 50, H); ctx.lineTo(gx - 20, H); ctx.closePath(); ctx.fill();
    for (const m of motes) { if (!reduce) { m.y -= dt * 0.03 * m.s; if (m.y < 0) m.y = 1; } ctx.fillStyle = `rgba(255,230,160,${0.5 * m.s})`; ctx.fillRect(gx - 10 + m.x * (gap + 60), floorY - 40 + m.y * (H - floorY + 30), 2, 2); }
    // frame + door
    ctx.fillStyle = "#4a3a32"; ctx.fillRect(dx - 10, dy - 12, dw + 20, 12); ctx.fillRect(dx - 10, dy, 10, dh); ctx.fillRect(dx + dw, dy, 10, dh);
    ctx.fillStyle = "#7a5638"; ctx.fillRect(dx, dy, dw - gap, dh);
    ctx.fillStyle = "#6a4a30"; for (let i = 1; i < 4; i++) ctx.fillRect(dx + ((dw - gap) / 4) * i, dy, 2, dh);
    ctx.fillStyle = "#5a3e28"; ctx.fillRect(dx, dy + dh * 0.2, dw - gap, 5); ctx.fillRect(dx, dy + dh * 0.75, dw - gap, 5);
    ctx.fillStyle = "#e8c35a"; ctx.fillRect(dx + dw - gap - 14, dy + dh * 0.5, 6, 6);
    ctx.fillStyle = "rgba(255,210,122,0.35)"; ctx.fillRect(gx - 2, dy, 2, dh);
    // sign
    ctx.fillStyle = "#e9d7aa"; ctx.fillRect(dx + dw / 2 - 44, dy - 44, 88, 22); ctx.fillStyle = "#4a3a32";
    ctx.font = "9px Silkscreen, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("BAUSTELLE", dx + dw / 2, dy - 33);

  if (cd) {

    const tick = () => { let s = Math.max(0, Math.floor((target - Date.now()) / 1000)); const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60; const b = cd.querySelectorAll("b"); [d, h, m, s].forEach((v, i) => (b[i].textContent = String(v).padStart(2, "0"))); };
    const iv = setInterval(tick, 1000); cleanups.push(() => clearInterval(iv));
  }
}

    { type: "Andenken", cap: "Der schönste Apéro ever.", name: "Sara Keller", loc: "Apéro", t: "16:10", photo: true },
  ];
  let idx = 0, pending = 12; const hist = [];
  const card = host.querySelector("[data-card]"), pend = host.querySelector("[data-pending]"), undo = host.querySelector("[data-undo]"), toast = host.querySelector(".m-modtoast");
  function show() {

    card.innerHTML = `<span class="stamp yes">Frei</span><span class="stamp no">Nein</span>${it.photo ? ph("Foto", "4/3", "border-radius:0") : ""}<div class="meta"><div class="m-row2"><span class="m-tag">${it.type}</span><span class="m-tag line">${it.loc}</span><span class="m-hint" style="margin-left:auto">${it.t}</span></div>${it.cap ? `<p class="${it.photo ? "" : "m-quote"}">${it.cap}</p>` : '<p class="m-muted sm">ohne Text</p>'}<span class="m-sig">– ${it.name}</span></div>`;
    pend.textContent = pending; undo.disabled = !hist.length;
  }
  let tt;

  function decide(yes) {
    card.style.transform = `translateX(${yes ? 460 : -460}px) rotate(${yes ? 18 : -18}deg)`;
    hist.push(idx); idx++; pending = Math.max(0, pending - 1);
    flash(yes ? "Freigegeben" : "Abgelehnt");
    setTimeout(show, 200);
  }
  function back() { if (!hist.length) return; idx = hist.pop(); pending++; flash("Rückgängig gemacht"); show(); }
  host.querySelectorAll("[data-decide]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.decide === "yes")));

  card.addEventListener("pointermove", (e) => {

    const scale = card.getBoundingClientRect().width / card.offsetWidth || 1;

    card.style.transform = `translateX(${dxv}px) rotate(${dxv / 20}deg)`;
    card.querySelector(".stamp.yes").style.opacity = Math.max(0, Math.min(1, dxv / 90));

  const end = () => { if (sx == null) return; sx = null; card.classList.remove("drag"); if (Math.abs(dxv) > 90) decide(dxv > 0); else show(); };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);

  window.addEventListener("keydown", kd); cleanups.push(() => window.removeEventListener("keydown", kd));
  const iv = setInterval(() => { pending++; pend.textContent = pending; }, 9000); cleanups.push(() => clearInterval(iv));
  show();
}

}
const qHtml = (q, s) => q.a
  ? `<div class="q done"><b>Q${q.n}. ${q.q}</b><span class="dec">✓ ${q.a}</span></div>`
  : `<div class="q">${q.n > 39 ? '<span class="new">new</span>' : ""}<b>Q${q.n}. ${q.q}</b><em>${q.p}</em>${s ? `<a class="sm" href="#${s.id}">${s.title}</a>` : ""}</div>`;

function render() {
  stopAll();
  const id = location.hash.slice(1) || "overview";
  document.querySelectorAll("[data-ix]").forEach((a) => a.classList.toggle("on", a.dataset.ix === id));
  document.querySelectorAll('.ix-top a').forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + id));
  const pick = document.getElementById("pick"); if (pick) pick.value = id;
  const s = byId(id);
  if (!s) return renderDoc(id === "questions" ? "questions" : "overview");
  const v = variant[id] || (s.variants ? s.variants[0][0] : null);
  const dkey = s.device || device;
  const d = DEV[dkey];
  const i = S.indexOf(s);
  const prev = S[i - 1], next = S[i + 1];
  const tb = document.getElementById("toolbar");
  tb.innerHTML = `<h1>${s.title}</h1>
    <div class="seg" role="group" aria-label="Device">${["phone", "desktop"].map((k) => `<button type="button" data-dev="${k}" class="${dkey === k ? "on" : ""}" ${s.device ? "disabled" : ""}>${k === "phone" ? "Phone" : "Desktop"}</button>`).join("")}</div>
    <div class="pager">${prev ? `<a href="#${prev.id}" title="${prev.title}">← Prev</a>` : ""}${next ? `<a href="#${next.id}" title="${next.title}">Next →</a>` : ""}</div>
    ${s.variants ? `<div class="variants" style="flex-basis:100%">State: ${s.variants.map(([k, l]) => `<button type="button" data-var="${k}" class="${k === v ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}`;
  tb.querySelectorAll("[data-dev]").forEach((b) => b.addEventListener("click", () => { device = b.dataset.dev; try { localStorage.setItem("zm-device", device); } catch (_) {} render(); }));
  tb.querySelectorAll("[data-var]").forEach((b) => b.addEventListener("click", () => { variant[id] = b.dataset.var; render(); }));

  const vp = document.getElementById("viewport");
  const urlH = d.url ? 34 : 0;
  const pad = dkey === "phone" ? 12 : dkey === "tv" ? 14 : 0;
  const outerW = d.w + pad * 2, outerH = d.h + pad * 2;
  vp.innerHTML = `<div class="dev-wrap"><div class="dev ${dkey}" style="width:${outerW}px;height:${outerH}px">${d.url ? `<div class="dev-url"><i></i><i></i><span>zappaloo.ch${s.path.replace(/ .*/, "")}</span></div>` : ""}<div class="screen" id="screen" style="height:${d.h - urlH}px">${s.render(v)}</div></div></div>`;
  fit(outerW, outerH);

  const notes = document.getElementById("notes");
  notes.hidden = false;
  notes.innerHTML = `<div class="nsec"><h2>${s.title}</h2><div class="path">${s.path}</div></div>
    <div class="nsec"><h4>Requirements</h4><div class="reqs">${s.reqs.map((r) => `<span class="req">${r}</span>`).join("")}</div></div>
    <div class="nsec"><h4>What it shows</h4><ul>${s.shows.map((x) => `<li>${x}</li>`).join("")}</ul></div>
    ${openQs(s.qs) ? `<div class="nsec"><h4>Open questions</h4>${s.qs.filter((q) => !q.a).map((q) => qHtml(q)).join("")}</div>` : ""}
    ${s.qs.length - openQs(s.qs) ? `<div class="nsec"><h4>Decided</h4>${s.qs.filter((q) => q.a).map((q) => qHtml(q)).join("")}</div>` : ""}`;

  const scr = document.getElementById("screen");
  scr.querySelectorAll("canvas[data-qr]").forEach(paintQr);
  wire(scr);
  requestAnimationFrame(() => {
    mountGame(scr, dkey !== "phone");
    mountDoor(scr);
    mountAvatars(scr);
    mountComposer(scr);
    mountModeration(scr);
    mountOtp(scr);
    mountQrPop(scr);
  });
}
function fit(w, h) {
  const vp = document.getElementById("viewport");
  const wrap = vp.querySelector(".dev-wrap"), dev = vp.querySelector(".dev");
  if (!wrap) return;
  const avail = vp.clientWidth;
  const s = Math.min(1, avail / w);
  dev.style.transform = `scale(${s})`;
  wrap.style.width = w * s + "px"; wrap.style.height = h * s + "px";
}
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const d = document.querySelector(".dev"); if (d) fit(parseFloat(d.style.width), parseFloat(d.style.height)); }, 80); });
window.addEventListener("hashchange", render);
buildIndex();
render();
})();
</script>
</body>
</html>
