# Release candidate (sw-architecture.md 23.3, OPS-10): started manually on main
# with the version to release. Runs the full test suite, builds the image with
# that version, pushes it as <version>-rc.<M>, tags v<version>-rc.<M> and
# publishes a GitHub pre-release with the deployment bundle. The number M is used up by the
# tag, and the tag is made by the very last step: the pre-release is created with `--target`, which makes
# GitHub create the tag when the release is published, after the assets are uploaded. A failure
# before that leaves no tag, so the next run takes the same number (tags `v*` are never moved or
# deleted, OPS-12, so a tag that exists could not be taken back).
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gravity981/zappaloo

jobs:
  prepare:
    name: Check and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release candidates are built from main only, not from $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "CI has not passed for $GITHUB_SHA; wait for it or fix main first." >&2
            exit 1
          fi
      - name: Plan the candidate
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.ts candidate "$VERSION" --github-output

  tests:
    name: Full test suite
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  release:
    name: Build and publish
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image contains the version without the -rc.M suffix (23.6).
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: infrastructure/scripts/smoke-test-image.sh "$IMAGE:$IMAGE_TAG" "$VERSION" "$GITHUB_SHA"
      # The JSON Schemas and the format documents are generated from the code, which needs the
      # packages (zod) installed; the example theme alone needs no install.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Everything the pre-release needs is made before the image is pushed and the tag is set, so that
      # a failure here does not use up the number of the candidate.
      - name: Prepare the pre-release (bundle, assets, notes)
        run: |
          set -euo pipefail
          bundle=$(node scripts/release/cli.ts bundle "$TAG" dist --ref "$GITHUB_SHA")
          # The example theme package, built from this commit; it is a release asset of its own.
          example=$(node scripts/build-example-theme.ts dist)
          # The JSON Schemas (committed in schemas/) and the format documents (build output, generated
          # into dist/formats) of the packages, both from this commit (THM-07, MAP-17).
          node scripts/schemas/cli.ts schemas dist/formats > /dev/null
          schemas=(schemas/*.json dist/formats/*.md)
          # Changelog from the commit messages since the previous release, and the
          # commands to install or update staging with the bundle (OPS-19).
          node scripts/release/cli.ts notes "$TAG" "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA" \
            --intro "Release candidate of $VERSION, image \`$IMAGE:$IMAGE_TAG\`." > notes.md
          printf '%s\n' "$bundle" "$example" "${schemas[@]}" > assets.txt
      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push "$IMAGE:$IMAGE_TAG"
      # The last step, and the only one that makes the tag: GitHub creates `v<version>-rc.<M>` on the commit
      # when it publishes the release, after the assets are uploaded. If the step fails before that, there
      # is no tag and the number is free; the image pushed above is overwritten by the next run (the tag of
      # an image is mutable, and nothing deploys it without the pre-release).
      - name: GitHub pre-release with the deployment bundle (this creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < assets.txt
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Zappaloo $TAG" \
            --notes-file notes.md "${assets[@]}"
