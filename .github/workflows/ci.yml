# CI (sw-architecture.md 23.2, OPS-06, OPS-08): every pull request and every push
# to main. Checks and end-to-end tests run in parallel. The image is built,
# smoke-tested and deployment-tested only after both passed, and pushed to the
# registry only from main. The requirement report combines the results of all jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The full test suite of a release candidate (release-candidate.yml)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/gravity981/zappaloo

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: last release for the version and the migration check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Migration check
        run: npm run migration-check
      - name: Build
        run: npm run build
      - name: Unit, component and integration tests
        run: npm test
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: reports/vitest.json
          retention-days: 14

  # Runs in parallel with the checks, in Playwright's official image: browsers and
  # their system packages are preinstalled, so nothing is installed at run time.
  # The image tag must match the @playwright/test version in package.json.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: last release for the dev version the backend reports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            reports/playwright.json
            playwright-report/
          retention-days: 14

  image:
    name: Image
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Determine version
        id: version
        run: node scripts/version/cli.ts ci --run-number "${{ github.run_number }}" --github-output
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layers are cached in the GitHub Actions cache: unchanged dependency layers
      # (npm ci) are reused, only changed sources are rebuilt.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ steps.version.outputs.commit }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: >-
          infrastructure/scripts/smoke-test-image.sh
          "$IMAGE:${{ steps.version.outputs.image_tag }}"
          "${{ steps.version.outputs.version }}"
          "${{ steps.version.outputs.commit }}"
      - name: Deployment test
        env:
          ZAPPALOO_TEST_IMAGE: ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
        run: npm run test:deploy
      - name: Upload deployment test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-results
          path: reports/vitest-deploy.json
          retention-days: 14
      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ steps.version.outputs.image_tag }}" "$IMAGE:main"
          docker push "$IMAGE:${{ steps.version.outputs.image_tag }}"
          docker push "$IMAGE:main"

  report:
    name: Requirement report
    needs: [checks, e2e, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Single-file artifacts are downloaded into reports/; e2e-results keeps its
      # reports/ folder (two paths are uploaded relative to the repository root).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-results
          path: reports
      - name: Requirement report
        run: npm run req-report
      - name: Upload requirement report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirement-report
          path: reports/requirements.md
          retention-days: 30
