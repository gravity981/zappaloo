# CI (sw-architecture.md 23.2, OPS-06, OPS-08): every pull request and every push
# to main. The image is built and smoke-tested only after all checks passed, and
# pushed to the registry only from main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/gravity981/zappaloo

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: last release for the version and the migration check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Migration check
        run: npm run migration-check
      - name: Build
        run: npm run build
      - name: Unit, component and integration tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Requirement report
        if: ${{ !cancelled() }}
        run: npm run req-report
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            reports/
            playwright-report/
          retention-days: 14

  image:
    name: Image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Determine version
        id: version
        run: node scripts/version/cli.ts ci --run-number "${{ github.run_number }}" --github-output
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        run: >-
          docker buildx build --load --provenance=false
          -f infrastructure/docker/Dockerfile
          --build-arg APP_VERSION="${{ steps.version.outputs.version }}"
          --build-arg APP_COMMIT="${{ steps.version.outputs.commit }}"
          -t "$IMAGE:${{ steps.version.outputs.image_tag }}"
          .
      - name: Smoke test
        run: >-
          infrastructure/scripts/smoke-test-image.sh
          "$IMAGE:${{ steps.version.outputs.image_tag }}"
          "${{ steps.version.outputs.version }}"
          "${{ steps.version.outputs.commit }}"
      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ steps.version.outputs.image_tag }}" "$IMAGE:main"
          docker push "$IMAGE:${{ steps.version.outputs.image_tag }}"
          docker push "$IMAGE:main"
