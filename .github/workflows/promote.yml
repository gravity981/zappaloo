# Promote a release candidate to a release (sw-architecture.md 23.3, OPS-11):
# started manually with the candidate tag. No rebuild: tags v<version> on the
# candidate's commit, adds the image tags <version>, <major>.<minor>, <major> to
# the candidate's image, and publishes the GitHub release with the bundle.
name: Promote

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate tag to promote (e.g. v0.1.0-rc.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gravity981/zappaloo

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Plan the promotion
        id: plan
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: node scripts/release/cli.ts promote "$CANDIDATE" --github-output
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          CANDIDATE_TAG: ${{ steps.plan.outputs.candidate_tag }}
          CANDIDATE_IMAGE_TAG: ${{ steps.plan.outputs.candidate_image_tag }}
          IMAGE_TAGS: ${{ steps.plan.outputs.image_tags }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          set -euo pipefail
          # The candidate's image must exist; it is re-tagged, never rebuilt.
          docker buildx imagetools inspect "$IMAGE:$CANDIDATE_IMAGE_TAG" > /dev/null
          commit=$(git rev-list -n 1 "$CANDIDATE_TAG")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG (promoted from $CANDIDATE_TAG)" "$commit"
          git push origin "refs/tags/$TAG"

          targets=()
          for tag in $IMAGE_TAGS; do targets+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${targets[@]}" "$IMAGE:$CANDIDATE_IMAGE_TAG"

          # The deployment bundle exactly as it was in the candidate's commit.
          mkdir bundle
          for file in compose.yaml deploy.sh .env.example; do
            git show "$commit:infrastructure/deploy/$file" > "bundle/$file"
          done
          notes_start=()
          if [ -n "$PREVIOUS_TAG" ]; then notes_start=(--notes-start-tag "$PREVIOUS_TAG"); fi
          gh release create "$TAG" --verify-tag --latest --title "Zappaloo $TAG" \
            --generate-notes "${notes_start[@]}" \
            --notes "Promoted from $CANDIDATE_TAG (commit $commit) without rebuilding. Deploy: \`./deploy.sh prod $VERSION\`." \
            bundle/compose.yaml bundle/deploy.sh bundle/.env.example
